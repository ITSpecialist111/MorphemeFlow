<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MorphemeFlow Settings</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="settings-container">
    <header class="settings-header">
      <h1>MorphemeFlow</h1>
      <p class="subtitle">Universal dyslexia reading support</p>
    </header>

    <section class="settings-section">
      <div class="toggle-row">
        <label for="toggle-enabled">Enable Overlay</label>
        <input type="checkbox" id="toggle-enabled" />
        <span class="hotkey-hint">Ctrl+Shift+M</span>
      </div>
    </section>

    <section class="settings-section">
      <h2>Morpheme Highlighting</h2>
      <div class="toggle-row">
        <label for="morpheme-enabled">Enabled</label>
        <input type="checkbox" id="morpheme-enabled" checked />
      </div>
      <div class="color-row">
        <label>Prefix</label>
        <input type="color" id="prefix-color" value="#7C3AED" />
        <label>Root</label>
        <input type="color" id="root-color" value="#1E293B" />
        <label>Suffix</label>
        <input type="color" id="suffix-color" value="#059669" />
      </div>
      <div class="slider-row">
        <label>Intensity</label>
        <input type="range" id="morpheme-intensity" min="0" max="100" value="60" />
        <span class="slider-value" id="morpheme-intensity-value">60%</span>
      </div>
    </section>

    <section class="settings-section">
      <h2>Syllable Spacing</h2>
      <div class="toggle-row">
        <label for="syllable-enabled">Enabled</label>
        <input type="checkbox" id="syllable-enabled" checked />
      </div>
      <div class="slider-row">
        <label>Spacing</label>
        <input type="range" id="syllable-intensity" min="0" max="20" value="8" step="1" />
        <span class="slider-value" id="syllable-intensity-value">0.08em</span>
      </div>
    </section>

    <section class="settings-section">
      <h2>Reading Ruler</h2>
      <div class="toggle-row">
        <label for="ruler-enabled">Enabled</label>
        <input type="checkbox" id="ruler-enabled" />
      </div>
      <div class="radio-row">
        <label><input type="radio" name="ruler-mode" value="focus" checked /> Focus Window</label>
        <label><input type="radio" name="ruler-mode" value="highlight" /> Highlight Band</label>
        <label><input type="radio" name="ruler-mode" value="underline" /> Underline</label>
      </div>
      <div class="slider-row">
        <label>Height</label>
        <input type="range" id="ruler-height" min="40" max="200" value="100" />
        <span class="slider-value" id="ruler-height-value">100px</span>
      </div>
    </section>

    <section class="settings-section">
      <h2>Typography</h2>
      <div class="select-row">
        <label>Font</label>
        <select id="font-select">
          <option value="lexend">Lexend</option>
          <option value="atkinson">Atkinson Hyperlegible</option>
          <option value="verdana">Verdana</option>
          <option value="opendyslexic">OpenDyslexic</option>
          <option value="system">System Default</option>
        </select>
      </div>
      <div class="slider-row">
        <label>Letter Spacing</label>
        <input type="range" id="letter-spacing" min="0" max="20" value="7" />
        <span class="slider-value" id="letter-spacing-value">0.07em</span>
      </div>
      <div class="theme-row">
        <label>Background Theme</label>
        <div class="theme-swatches">
          <button class="swatch" data-theme="default" style="background:#fff" title="Default"></button>
          <button class="swatch active" data-theme="cream" style="background:#FAF4EB" title="Cream"></button>
          <button class="swatch" data-theme="pale-blue" style="background:#EFF6FF" title="Blue"></button>
          <button class="swatch" data-theme="peach" style="background:#FFF1E6" title="Peach"></button>
          <button class="swatch" data-theme="soft-green" style="background:#ECFDF5" title="Green"></button>
          <button class="swatch" data-theme="dark" style="background:#1A1A2E" title="Dark"></button>
        </div>
      </div>
    </section>

    <section class="settings-section presets">
      <h2>Presets</h2>
      <div class="preset-buttons">
        <button class="preset-btn" data-preset="subtle">Subtle</button>
        <button class="preset-btn active" data-preset="balanced">Balanced</button>
        <button class="preset-btn" data-preset="full">Full</button>
      </div>
    </section>

    <section class="settings-section">
      <h2>Detection Method</h2>
      <div class="radio-row">
        <label><input type="radio" name="detection" value="auto" checked /> Auto</label>
        <label><input type="radio" name="detection" value="accessibility" /> Accessibility API</label>
        <label><input type="radio" name="detection" value="ocr" /> OCR</label>
      </div>
      <div class="radio-row">
        <label><input type="radio" name="scope" value="fullscreen" /> Full Screen</label>
        <label><input type="radio" name="scope" value="active" checked /> Active Window</label>
        <label><input type="radio" name="scope" value="region" /> Region</label>
      </div>
    </section>
  </div>

  <script type="module" src="./settings-ui.ts"></script>
</body>
</html>
