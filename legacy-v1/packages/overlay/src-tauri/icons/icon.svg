<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bg)"/>
  <!-- Letter M with morpheme styling -->
  <text x="64" y="88" font-family="system-ui, sans-serif" font-size="72" font-weight="700" fill="white" text-anchor="middle">M</text>
  <!-- Morpheme indicator dots -->
  <circle cx="30" cy="105" r="5" fill="#C4B5FD" opacity="0.8"/>
  <circle cx="64" cy="105" r="5" fill="white" opacity="0.9"/>
  <circle cx="98" cy="105" r="5" fill="#6EE7B7" opacity="0.8"/>
</svg>
