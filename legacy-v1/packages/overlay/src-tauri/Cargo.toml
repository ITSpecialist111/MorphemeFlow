[package]
name = "morphemeflow-overlay"
version = "0.1.0"
edition = "2021"
description = "MorphemeFlow universal screen overlay for dyslexia reading support"
default-run = "morphemeflow-overlay"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Accessibility",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_System_Ole",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "morphemeflow_overlay_lib"
crate-type = ["lib", "cdylib", "staticlib"]
