[package]
name = "overlay-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
compositor = { workspace = true }
engine = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
once_cell = { workspace = true }

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
]
