[workspace]
members = [
    "crates/engine",
    "crates/compositor",
    "crates/overlay-daemon"
]
resolver = "2"

[workspace.dependencies]
engine = { path = "crates/engine" }
compositor = { path = "crates/compositor" }
windows = "0.58.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
log = "0.4"
env_logger = "0.11"
