[workspace]
members = [
    "crates/engine",
    "apps/reader-windows/src-tauri",
]
exclude = [
    "experiments/zero-latency-overlay/crates/compositor",
    "experiments/zero-latency-overlay/crates/overlay-daemon",
]
resolver = "2"

[workspace.dependencies]
engine = { path = "crates/engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
log = "0.4"
lru = "0.12"
env_logger = "0.11"
